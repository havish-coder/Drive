<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudSync</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2128; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fed; --accent-ink: #fff; --ok: #12805c; --bad: #c0362c; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --ink: #e8ebf0; --muted: #98a2b3; --line: #262c35;
            --accent: #5b8cff; --accent-ink: #0b1020; --ok: #3ecf9e; --bad: #ff7b70; --warn: #e8b04a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  input[type=text] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); width: 150px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat.hero .v { color: var(--ok); }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .mode { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .mode:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .mode b { display: block; font-size: 14px; } .mode span { color: var(--muted); font-size: 12.5px; }
  .mode input { margin-right: 6px; }
  .job { margin-top: 12px; font-size: 13px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .result { color: var(--ok); } .error { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { word-break: break-all; }
  .empty { color: var(--muted); padding: 16px 8px; text-align: center; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .chunkrow td { background: color-mix(in srgb, var(--muted) 6%, transparent); }
  .map { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
  .map i { width: 14px; height: 14px; border-radius: 3px; display: block; }
  .map i.shared { outline: 2px solid var(--ink); outline-offset: 1px; }
  .legend { color: var(--muted); font-size: 12px; }
  .chunkscroll { max-height: 320px; overflow: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .chunkscroll table td, .chunkscroll table th { padding: 4px 8px; }
  .chunkscroll th { position: sticky; top: 0; background: var(--card); }
  td.sizebar { width: 28%; min-width: 80px; }
  td.sizebar .bar { margin: 0; }
  code { font-size: 12px; } .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; max-width: 90vw; }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>CloudSync <small>chunked storage &amp; delta sync</small></h1>
    <label class="user">Signed in as <input id="user" type="text" value="demo-user" aria-label="User id"></label>
  </header>

  <section class="card" aria-label="System stats">
    <h2>Whole system <span class="legend">(all users)</span></h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2>Upload</h2>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="stream" checked><b>Stream to server</b>
        <span>Whole file is sent; the server chunks, hashes and dedups it.</span></label>
      <label class="mode"><input type="radio" name="mode" value="delta"><b>Delta sync (browser chunks)</b>
        <span>Browser hashes 4 MB blocks, asks which are missing, sends only those.</span></label>
    </div>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose files to upload">
      Drop files here or <u>browse</u>
      <input id="picker" type="file" multiple hidden>
    </div>
    <div id="jobs"></div>
  </section>

  <section class="card">
    <h2>Your files</h2>
    <table>
      <thead><tr><th>Name</th><th class="num">Size</th><th class="num hide-sm">Chunks</th><th class="hide-sm">Uploaded</th><th></th></tr></thead>
      <tbody id="files"></tbody>
    </table>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const CHUNK = 4 * 1024 * 1024;
const $ = s => document.querySelector(s);
const user = () => $('#user').value.trim() || 'anonymous';
const auth = () => ({ 'X-User-Id': user() });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
function fmt(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500); }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...auth(), ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
  return r;
}

// ---------- stats ----------
async function loadStats() {
  const s = await (await api('/api/stats')).json();
  const cells = [
    ['Files', s.fileCount], ['Unique chunks', s.chunkCount],
    ['Logical size', fmt(s.logicalBytes)], ['Physical size', fmt(s.physicalBytes)],
    ['Dedup ratio', s.physicalBytes ? s.dedupRatio.toFixed(2) + '×' : '–', 'hero'],
    ['Space saved', s.logicalBytes ? fmt(Math.max(0, s.logicalBytes - s.physicalBytes)) : '–', 'hero'],
  ];
  $('#stats').innerHTML = cells.map(([l, v, c]) => `<div class="stat ${c || ''}"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`).join('');
}

// ---------- files ----------
let fileList = [];
async function loadFiles() {
  fileList = await (await api('/api/files')).json();
  const body = $('#files');
  if (!fileList.length) { body.innerHTML = '<tr><td colspan="5" class="empty">No files yet for this user. Upload one above.</td></tr>'; return; }
  body.innerHTML = fileList.map(f => `
    <tr data-id="${f.fileId}">
      <td class="name">${esc(f.fileName)}<div class="legend mono">${esc(f.chunker)}</div></td>
      <td class="num">${fmt(f.totalSize)}</td>
      <td class="num hide-sm" data-chunks>–</td>
      <td class="hide-sm">${new Date(f.createdAt).toLocaleString()}</td>
      <td class="num"><button data-act="chunks">Chunks</button> <button class="primary" data-act="download">Download</button></td>
    </tr>`).join('');
  for (const f of fileList) manifest(f.fileId).then(m => {
    const cell = body.querySelector(`tr[data-id="${f.fileId}"] [data-chunks]`);
    if (cell) cell.textContent = m.chunks.length;
  }).catch(() => {});
}

$('#files').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  btn.disabled = true;
  try {
    if (btn.dataset.act === 'chunk-dl') return await downloadChunk(btn.closest('tr.chunkrow').dataset.file, btn);
    const row = btn.closest('tr'); const id = row.dataset.id;
    btn.dataset.act === 'download' ? await download(id, btn) : await toggleChunks(row, id);
  } catch (err) { toast('Failed: ' + err.message); }
  finally { btn.disabled = false; }
});

function saveBlob(blob, name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function download(id, btn) {
  const f = fileList.find(x => x.fileId === id);
  btn.textContent = 'Downloading…';
  const r = await api(`/api/files/${id}`);
  const blob = await r.blob();
  if (blob.size !== f.totalSize) throw new Error(`got ${blob.size} of ${f.totalSize} bytes (server aborted: integrity failure?)`);
  const expected = r.headers.get('X-Content-SHA256');
  let verified = '';
  if (expected && blob.size < 512 * 1024 * 1024) {
    const actual = hex(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()));
    if (actual !== expected) throw new Error('SHA-256 mismatch. File is corrupt.');
    verified = ' (SHA-256 verified ✓)';
  }
  saveBlob(blob, f.fileName);
  toast(`Downloaded ${f.fileName}${verified}`);
  btn.textContent = 'Download';
}

async function manifest(id) { return (await api(`/api/files/${id}/manifest`)).json(); }

async function downloadChunk(fileId, btn) {
  const f = fileList.find(x => x.fileId === fileId), label = btn.textContent;
  btn.textContent = '…';
  try {
    const blob = await (await api(`/api/files/${fileId}/chunks/${btn.dataset.index}`)).blob();
    const actual = hex(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()));
    if (actual !== btn.dataset.hash) throw new Error(`chunk ${btn.dataset.index} failed its SHA-256 check`);
    saveBlob(blob, `${f.fileName}.chunk${btn.dataset.index}`);
    toast(`Chunk ${btn.dataset.index} downloaded: ${fmt(blob.size)}, SHA-256 verified ✓`);
  } finally { btn.textContent = label; }
}

// Chunk view: a map (one square per chunk, outlined if another file shares it) plus a size table with per-chunk download.
async function toggleChunks(row, id) {
  const next = row.nextElementSibling;
  if (next && next.classList.contains('chunkrow')) { next.remove(); return; }
  const manifests = await Promise.all(fileList.map(f => manifest(f.fileId)));
  const refs = new Map();
  for (const m of manifests) for (const h of new Set(m.chunks.map(c => c.chunkHash))) refs.set(h, (refs.get(h) || 0) + 1);
  const mine = manifests.find(m => m.file.fileId === id);
  const chunks = mine.chunks.slice(0, 1500);
  const sizes = mine.chunks.map(c => c.byteSize);
  const max = sizes.reduce((a, b) => Math.max(a, b), 0), min = sizes.reduce((a, b) => Math.min(a, b), Infinity);
  const avg = sizes.reduce((a, b) => a + b, 0) / sizes.length;
  const shared = mine.chunks.filter(c => refs.get(c.chunkHash) > 1).length;
  const hue = h => parseInt(h.slice(0, 4), 16) % 360;

  const squares = chunks.map(c => `<i class="${refs.get(c.chunkHash) > 1 ? 'shared' : ''}" style="background:hsl(${hue(c.chunkHash)} 60% 55%)" title="#${c.sequenceIndex} · ${fmt(c.byteSize)}"></i>`).join('');
  const rows = chunks.map(c => {
    const n = refs.get(c.chunkHash);
    return `<tr>
      <td class="num">${c.sequenceIndex}</td>
      <td class="num">${fmt(c.byteSize)}<div class="legend">${c.byteSize.toLocaleString()} B</div></td>
      <td class="sizebar"><div class="bar"><i style="width:${(c.byteSize / max * 100).toFixed(1)}%;background:hsl(${hue(c.chunkHash)} 60% 55%)"></i></div></td>
      <td class="mono hide-sm">${c.chunkHash.slice(0, 12)}…</td>
      <td>${n > 1 ? `shared ×${n}` : 'unique'}</td>
      <td class="num"><button data-act="chunk-dl" data-index="${c.sequenceIndex}" data-hash="${c.chunkHash}">Download</button></td>
    </tr>`;
  }).join('');

  const tr = document.createElement('tr'); tr.className = 'chunkrow'; tr.dataset.file = id;
  tr.innerHTML = `<td colspan="5">
    <div class="legend"><b>${mine.chunks.length}</b> chunks · size min <b>${fmt(min)}</b> · avg <b>${fmt(avg)}</b> · max <b>${fmt(max)}</b> · <b>${shared}</b> shared with your other files (outlined) · ${mine.chunks.length - shared} unique</div>
    <div class="map">${squares}</div>
    <div class="chunkscroll"><table><thead><tr><th class="num">#</th><th class="num">Size</th><th>Relative size</th><th class="hide-sm">SHA-256</th><th>Used by</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    ${mine.chunks.length > chunks.length ? `<div class="legend">Showing first ${chunks.length} of ${mine.chunks.length}.</div>` : ''}</td>`;
  row.after(tr);
}

// ---------- upload ----------
const drop = $('#drop'), picker = $('#picker');
drop.onclick = () => picker.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); startUploads(e.dataTransfer.files); };
picker.onchange = () => { startUploads(picker.files); picker.value = ''; };

async function startUploads(files) {
  for (const file of files) await uploadOne(file);
  await Promise.all([loadStats(), loadFiles()]);
}

function newJob(name) {
  const el = document.createElement('div'); el.className = 'job';
  el.innerHTML = `<div><b>${esc(name)}</b> <span class="msg">starting…</span></div><div class="bar"><i></i></div>`;
  $('#jobs').prepend(el);
  return { set(pct, msg) { el.querySelector('i').style.width = pct + '%'; el.querySelector('.msg').textContent = msg; },
           done(msg) { this.set(100, ''); el.querySelector('.msg').outerHTML = `<span class="result">${msg}</span>`; },
           fail(msg) { el.querySelector('.msg').outerHTML = `<span class="error">${esc(msg)}</span>`; } };
}

async function uploadOne(file) {
  const job = newJob(file.name);
  const mode = document.querySelector('input[name=mode]:checked').value;
  try {
    if (mode === 'stream') {
      const r = await xhrUpload(file, (l, t) => job.set(l / t * 100, `sending ${fmt(l)} / ${fmt(t)}`));
      job.done(`✓ ${r.chunkCount} chunks: ${r.newChunks} new written, ${r.dedupedChunks} deduplicated. Sent ${fmt(file.size)}.`);
    } else {
      const r = await deltaUpload(file, job);
      const saved = file.size ? (100 * (file.size - r.sent) / file.size).toFixed(1) : '0.0';
      job.done(`✓ ${r.total} chunks: ${r.uploaded} uploaded, ${r.total - r.uploaded} already on server. Sent ${fmt(r.sent)} of ${fmt(file.size)} (${saved}% bandwidth saved).`);
    }
  } catch (err) { job.fail('✗ ' + err.message); }
}

function xhrUpload(file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', '/api/files?fileName=' + encodeURIComponent(file.name));
    x.setRequestHeader('X-User-Id', user());
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded, e.total);
    x.onload = () => x.status === 201 ? resolve(JSON.parse(x.responseText)) : reject(new Error(`${x.status} ${x.responseText.slice(0, 200)}`));
    x.onerror = () => reject(new Error('network error'));
    x.send(file);
  });
}

// Delta sync: hash locally -> negotiate -> PUT only missing chunks -> commit manifest.
async function deltaUpload(file, job) {
  const hashes = [];
  for (let o = 0; o < file.size; o += CHUNK) {
    hashes.push(hex(await crypto.subtle.digest('SHA-256', await file.slice(o, o + CHUNK).arrayBuffer())));
    job.set(Math.min(o + CHUNK, file.size) / file.size * 30, `hashing ${fmt(Math.min(o + CHUNK, file.size))} / ${fmt(file.size)}`);
  }
  const { missing } = await (await api('/api/sync/negotiate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hashes }),
  })).json();
  const need = new Set(missing);
  const todo = []; const seen = new Set();
  hashes.forEach((h, i) => { if (need.has(h) && !seen.has(h)) { seen.add(h); todo.push(i); } });

  let sent = 0, next = 0, finished = 0;
  const worker = async () => {
    while (next < todo.length) {
      const i = todo[next++]; const blob = file.slice(i * CHUNK, (i + 1) * CHUNK);
      await api(`/api/chunks/${hashes[i]}`, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: blob });
      sent += blob.size; finished++;
      job.set(30 + finished / todo.length * 65, `uploading missing chunks ${finished} / ${todo.length}`);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, todo.length) }, worker));

  job.set(97, 'committing manifest…');
  await api('/api/sync/commit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fileName: file.name, chunks: hashes, chunker: `browser-fixed-${CHUNK}` }),
  });
  return { total: hashes.length, uploaded: todo.length, sent };
}

// ---------- boot ----------
async function refresh() { try { await Promise.all([loadStats(), loadFiles()]); } catch (e) { toast('Cannot reach API: ' + e.message); } }
$('#user').addEventListener('change', refresh);
refresh();
</script>
</body>
</html>
